<!doctype html>
<html lang="en" data-accent="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sofikul Islam | Portfolio</title>
    <meta

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved accent color before first paint to avoid a flash.
      try {
        var a = localStorage.getItem("accent");
        if (a === "green" || a === "cyan" || a === "amber" || a === "pink") {
          document.documentElement.setAttribute("data-accent", a);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
